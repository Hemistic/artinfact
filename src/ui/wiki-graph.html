<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><!--GRAPH_TITLE--></title><!--GRAPH_STYLE--></head><body>
<header class="graph-header"><div class="identity"><span class="brand-mark" aria-hidden="true">A</span><div><small>ARTINFACT / KNOWLEDGE</small><h1 id="graph-title">知识图谱</h1></div></div><div class="view-switch" role="group" aria-label="展示形式"><button id="network" aria-pressed="true">动态引力图</button><button id="layers" aria-pressed="false">分层卡片</button></div><button id="theme" title="切换明暗主题" aria-label="切换明暗主题"></button></header>
<div class="filter-bar"><button id="browse" aria-label="显示节点目录" aria-expanded="false">节点目录</button><div id="types" role="group" aria-label="节点类型"></div><label class="system-toggle"><input id="system" type="checkbox">系统页面</label></div>
<main><aside class="catalog"><div class="catalog-heading"><strong>节点目录</strong><span id="list-count"></span></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索标题、标签或路径" aria-label="搜索节点"></label><div id="node-list"></div><footer id="totals"></footer></aside>
<section class="map" aria-label="知识图谱画布"><div class="map-caption"><span class="eyebrow">关系地图</span><p id="map-caption">拖动节点，探索知识之间的引力。</p></div><canvas id="graph" aria-label="可拖动节点和缩放的动态引力图；使用节点目录选择节点" tabindex="0"></canvas><div id="empty" hidden><strong>没有可展示的节点</strong><p id="empty-help"></p><button id="clear-filters">清除筛选</button></div><div class="map-bottom"><span id="visible-count" role="status" aria-live="polite"></span><div class="map-controls"><button id="restart" aria-label="重新运行引力布局" title="重新运行引力布局"></button><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-value"></span><button id="zoom-in" aria-label="放大">+</button><button id="fit" title="适应全部节点">适应画布</button></div></div></section>
<aside id="detail" class="detail" hidden></aside></main>
<script type="application/json" id="graph-data"><!--GRAPH_DATA--></script><script><!--GRAPH_SCRIPT--></script></body></html>
