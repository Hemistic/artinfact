<style>
.wb-study-note{--study-ink:#252b32;--study-muted:#748087;--study-paper:#fff;--study-evidence:#f7f8f6;color:var(--study-ink);background:var(--study-paper);padding:20px 22px 14px;overflow-wrap:anywhere;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wb-study-label{display:inline-block;padding:2px 8px;border-radius:5px;background:#e9f1ed;color:#526c61;font-size:11px;line-height:1.6;margin-bottom:12px}
.wb-study-upper .wb-note-surface .ProseMirror{min-height:100px;padding:0;font-size:17px;line-height:1.7}.wb-study-upper h1,.wb-study-upper h2,.wb-study-upper h3{font-size:21px!important;line-height:1.45;margin:0 0 12px;font-weight:650}.wb-study-upper strong{font-weight:650}.wb-study-upper .ProseMirror p{margin:10px 0}.wb-study-upper .ProseMirror ul,.wb-study-upper .ProseMirror ol{padding-left:22px}
.wb-study-note .wb-inline-note-editor{border:0!important;background:transparent!important;padding:0!important;display:block!important}.wb-study-note .wb-inline-note-editor>.wb-note-title[hidden]{display:none!important}.wb-study-note .wb-note-editor-body{padding:0!important;overflow:visible!important}
.wb-study-evidence{margin:20px 0 12px;padding-top:14px;border-top:1px solid #e6e9e6}.wb-study-evidence>summary{font-size:12px;color:var(--study-muted);cursor:pointer;user-select:none;list-style:none;display:flex;align-items:center;gap:7px}.wb-study-evidence>summary::-webkit-details-marker{display:none}.wb-study-evidence>summary:before{content:"›";font-size:17px;line-height:1;transform:rotate(0deg);width:10px;text-align:center}.wb-study-evidence[open]>summary:before{transform:rotate(90deg)}
.wb-study-excerpts{margin-top:12px;padding:14px 16px;background:var(--study-evidence);border-radius:6px}.wb-study-excerpt+.wb-study-excerpt{margin-top:18px;padding-top:14px;border-top:1px solid #8882}.wb-study-excerpt>small{display:block;color:var(--study-muted);font-size:11px;margin-bottom:8px}.wb-study-source-body.wb-note-surface .ProseMirror{min-height:0;padding:0;font-size:14px;line-height:1.8}.wb-study-source-body .ProseMirror p{margin:0 0 10px}.wb-study-source-body .ProseMirror p:last-child{margin-bottom:0}.wb-study-source-body .ProseMirror h1,.wb-study-source-body .ProseMirror h2,.wb-study-source-body .ProseMirror h3{font-size:15px;margin:0 0 8px}
.wb-study-footer{display:flex!important;align-items:center;flex-wrap:wrap;gap:6px 12px;padding-top:4px;color:var(--study-muted);font-size:11px;line-height:1.7}.wb-study-source{flex:1 1 180px;min-width:0}.wb-study-locate{color:#477c75;text-decoration:none;white-space:nowrap;font-size:11px}.wb-study-locate:hover{text-decoration:underline}.wb-study-locate[aria-busy=true]{opacity:.55;cursor:wait}.wb-study-footer .wb-note-editor-actions{flex:1 0 100%;border:0!important;background:none!important;padding:0!important;margin:0!important;display:flex!important;gap:8px;font-size:10px;color:var(--study-muted)}.wb-study-footer .wb-note-editor-actions button[hidden]{display:none!important}.wb-study-footer .wb-note-editor-actions [role=status]{margin:0;font-size:10px}.wb-study-error{flex-basis:100%;color:#b35c4a;font-size:11px}
.wb-card.wb-study-node{padding:0!important;background:var(--study-paper,#fff)!important;border:1px solid transparent!important;min-height:0!important;box-shadow:0 2px 12px #00000005!important}.wb-card.wb-study-node[data-selected=true]{border-color:#87b4df!important}.wb-card.wb-study-node>.wb-study-grip{height:12px;cursor:grab}.wb-card.wb-study-node .wb-study-note{padding-top:8px}.wb-card.wb-study-node .flow-node-note{max-height:none!important;overflow:visible!important;padding:0!important;margin:0!important}
[data-theme=dark] .wb-study-note,.theme-dark .wb-study-note{--study-ink:#e9eceb;--study-muted:#95a09c;--study-paper:#151515;--study-evidence:#202220}.wb-study-note[data-theme=dark]{--study-ink:#e9eceb;--study-muted:#95a09c;--study-paper:#151515;--study-evidence:#202220}[data-theme=dark] .wb-study-node,.theme-dark .wb-study-node{--study-paper:#151515}[data-theme=dark] .wb-study-label,.wb-study-note[data-theme=dark] .wb-study-label{background:#263830;color:#b4d0c0}[data-theme=dark] .wb-study-evidence,.wb-study-note[data-theme=dark] .wb-study-evidence{border-color:#313631}[data-theme=dark] .wb-study-locate,.wb-study-note[data-theme=dark] .wb-study-locate{color:#91b9b2}
.wb-study-excerpts,.wb-study-source-body{box-sizing:border-box;width:100%;min-width:0}.wb-study-source-body.wb-note-surface .ProseMirror{height:auto;max-height:none;overflow:visible}
.wb-study-excerpt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.wb-study-excerpt-head small{color:var(--study-muted);font-size:11px}
</style>
<style>
.wb-note-surface[data-readonly=true] .milkdown-toolbar,.wb-note-surface[data-readonly=true] .milkdown-block-handle,.wb-note-surface[data-readonly=true] .milkdown-slash-menu{display:none!important}
</style>
<style>
.wb-card.wb-study-node>.wb-study-grip{position:relative;height:24px;color:#87958e;opacity:0;touch-action:none;user-select:none;cursor:grab}
.wb-study-grip-target{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.wb-card.wb-study-node>.wb-study-grip svg{width:14px;height:14px;transform:rotate(90deg);pointer-events:none}
.wb-card.wb-study-node:hover>.wb-study-grip,.wb-card.wb-study-node[data-dragging=true]>.wb-study-grip{opacity:1}
.wb-card.wb-study-node .wb-study-label{cursor:grab;touch-action:none;user-select:none}
.wb-card.wb-study-node[data-dragging=true],.wb-card.wb-study-node[data-dragging=true] .wb-study-grip,.wb-card.wb-study-node[data-dragging=true] .wb-study-label{cursor:grabbing}
</style>
