<style>
/* Compact controls and whitespace; document typography keeps its own scale. */
html body[data-visual=editor],html body[data-visual=editor] *{scrollbar-color:color-mix(in srgb,var(--muted,#89939d) 28%,transparent) transparent}
html body[data-visual=editor] *::-webkit-scrollbar{width:2px!important;height:2px!important}
html body[data-visual=editor] *::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted,#89939d) 28%,transparent);border:0;border-radius:2px}
html body[data-visual=editor] *::-webkit-scrollbar-track,html body[data-visual=editor] *::-webkit-scrollbar-corner{background:transparent}
html body[data-visual=editor] *::-webkit-scrollbar-button{display:none;width:0;height:0}
/* Non-auto standard colors override Chromium's pixel-sized scrollbar rules. */
@supports selector(::-webkit-scrollbar){html body[data-visual=editor],html body[data-visual=editor] *{scrollbar-width:auto!important;scrollbar-color:auto!important}}
html body[data-visual=editor] .wb-md-fold-region:not(:hover):not(:focus-within)::-webkit-scrollbar-thumb{background:transparent}
.wb-editor .flow-editor-toolbar{padding:4px;gap:1px;border-radius:8px}
.wb-editor .flow-editor-toolbar .wb-tool{width:var(--wb-control-height);height:var(--wb-control-height);border-radius:4px}
.wb-editor .flow-editor-toolbar .wb-tool svg{width:16px;height:16px}
.wb-editor .flow-editor-toolbar .wb-tool-labelled{width:auto;min-width:60px;padding:0 8px;gap:5px}
.wb-editor .flow-editor-toolbar .wb-tool-divider{height:16px;margin:7px 3px}
.wb-editor .wb-floating-zoom{padding:3px;border-radius:7px}
.wb-editor .wb-floating-zoom .wb-tool{width:var(--wb-control-height);height:var(--wb-control-height)}
.wb-editor .wb-floating-zoom .wb-tool svg{width:14px;height:14px}
.wb-editor .wb-floating-zoom .flow-zoom-label{height:var(--wb-control-height);min-width:36px}
.wb-editor .wb-canvas-modes{padding:3px;gap:2px;border-radius:7px}
.wb-editor .wb-canvas-modes :is(button,.wb-tool){box-sizing:border-box;width:var(--wb-control-height);height:var(--wb-control-height);padding:5px}
.wb-editor .wb-canvas-modes svg{width:16px;height:16px}
.wb-editor .wb-floating-theme{width:var(--wb-control-height);height:var(--wb-control-height);border-radius:7px}
.wb-editor .wb-floating-theme svg{width:16px;height:16px}
.wb-editor .wb-canvas-top-actions{position:absolute;z-index:20;right:14px;top:14px;display:flex;align-items:center;gap:2px;padding:3px;border-radius:7px;background:var(--wb-card-surface,var(--bg));box-shadow:0 2px 8px #0000000b;pointer-events:auto}
.wb-editor .wb-canvas-top-actions .wb-tool{position:relative;inset:auto;box-sizing:border-box;width:var(--wb-control-height);height:var(--wb-control-height);padding:5px;border-radius:5px;background:transparent;box-shadow:none}
.wb-editor .wb-canvas-top-actions .wb-tool svg{width:16px;height:16px}
.wb-editor .wb-canvas-settings{position:fixed;inset:52px 14px auto auto;box-sizing:border-box;width:210px;max-width:calc(100vw - 28px);max-height:calc(100dvh - 70px);overflow:auto;margin:0;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--wb-card-surface,var(--bg));color:var(--fg);box-shadow:0 6px 24px #0002;pointer-events:auto}
.wb-editor .wb-canvas-settings:popover-open{display:flex;flex-direction:column;gap:2px}
.wb-editor .wb-canvas-settings strong{padding:6px 8px;font-size:12px;color:var(--muted)}
.wb-editor .wb-canvas-settings button{min-height:var(--wb-control-height);padding:6px 8px;border:0;border-radius:5px;background:transparent;color:var(--fg);font-size:12px;text-align:left;cursor:pointer}
.wb-editor .wb-canvas-settings button:hover{background:var(--soft)}
.wb-editor .graph-setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 8px;font-size:12px;color:var(--fg)}
.wb-editor .graph-setting-row select{box-sizing:border-box;width:86px;height:var(--wb-control-height);padding:0 5px;border:1px solid var(--line);border-radius:4px;background:var(--wb-card-surface,var(--bg));color:var(--fg);font:inherit;cursor:pointer}
.wb-editor .graph-setting-row select:disabled{opacity:.45;cursor:default}
.wb-editor .graph-setting-row select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wb-editor :is(.wb-library,.wb-inspector,.wb-insert-panel){padding:12px;border-radius:12px;backdrop-filter:none}
.wb-editor .wb-drawer-head{top:-12px;padding-bottom:7px}
.wb-editor .wb-drawer-head .wb-tool{width:var(--wb-control-height);height:var(--wb-control-height)}
.wb-editor .wb-library .flow-board-item{padding:8px 10px}
.wb-editor .wb-insert-head{margin-bottom:9px}
.wb-editor .wb-insert-actions{gap:6px}
.wb-editor .wb-insert-actions button{padding:7px 6px}
.wb-editor .wb-insert-panel>input[type=search]{padding:7px 9px;margin:7px 0 6px;border-radius:7px}
.wb-editor .wb-asset-folder>summary{min-height:28px;padding-block:3px;gap:5px}
.wb-editor .wb-asset-item{padding:5px 7px!important}
.wb-editor .wb-more-menu{padding:5px;gap:2px;border-radius:9px}
.wb-editor .wb-more-menu button{padding:8px 10px;border-radius:6px}
body .wb-editor .wb-card:not(.wb-study-node){padding:6px 18px 10px;gap:6px}
.wb-editor .wb-study-note{padding:16px 18px 12px}
.wb-editor .wb-card.wb-study-node>.wb-study-grip{height:calc(var(--wb-control-height) + 12px)}
.wb-editor .wb-study-label{padding:0 6px;margin-bottom:9px;border-radius:4px}
.wb-editor .wb-study-evidence{margin:16px 0 10px;padding-top:10px}
.wb-editor .wb-study-excerpts{margin-top:9px;padding:10px 12px;border-radius:5px}
.wb-editor .wb-study-excerpt+.wb-study-excerpt{margin-top:14px;padding-top:10px}
.wb-editor .wb-card>.wb-card-research-trigger{width:var(--wb-control-height);height:var(--wb-control-height);top:6px;right:34px;padding:4px!important}
.wb-editor .wb-card>.wb-card-research-trigger svg,.wb-editor .wb-card-menu>summary svg{width:14px;height:14px}
.wb-editor .wb-card-menu-panel{padding:6px;border-radius:8px}
.wb-editor .wb-card-menu-panel :is(button,summary){padding:5px 7px}
.wb-editor .wb-card-corner svg{width:14px;height:14px}
.wb-editor .wb-port::before{width:6px;height:6px;left:9px;top:9px}
body .wb-editor .wb-card[data-selected=true]{outline-width:1.5px!important;outline-offset:1px!important}
body[data-visual=editor] .research-ui-popover{padding:8px;border-radius:8px}
body[data-visual=editor] .research-ui-head{gap:6px;margin-bottom:6px}
body[data-visual=editor] .research-ui-scope{padding:5px 6px;margin-bottom:6px}
body[data-visual=editor] .research-ui-presets{gap:2px}
body[data-visual=editor] .research-ui .research-ui-preset{padding:6px;gap:6px}
body[data-visual=editor] .research-ui-custom{margin-top:6px}
body[data-visual=editor] .research-ui textarea{padding:6px;margin:4px 0 5px}
body[data-visual=editor] .research-ui-bottom{margin-top:6px;padding-top:6px;gap:6px}
@media(max-width:680px){.wb-editor .flow-editor-toolbar{padding:4px;gap:1px}.wb-editor .flow-editor-toolbar .wb-tool{width:var(--wb-control-height);height:var(--wb-control-height)}.wb-editor .flow-editor-toolbar .wb-tool-labelled{width:auto}}

/* The 24px row size comes from canvas-control-size.ts. Text may wrap naturally. */
.wb-editor .wb-card-origin{min-height:var(--wb-control-height);padding-right:50px;margin-bottom:0}
.wb-editor :is(.wb-origin-badge,.wb-study-label){box-sizing:border-box;display:inline-flex;align-items:center;height:var(--wb-control-height);padding-block:0;line-height:16px}
.wb-editor .wb-study-node .wb-study-label{position:absolute;left:18px;top:6px;max-width:calc(100% - 92px);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb-editor .wb-card-menu{top:6px;right:6px}
.wb-editor .wb-card-menu>summary{box-sizing:border-box;width:var(--wb-control-height);height:var(--wb-control-height);min-height:0;padding:4px!important}
.wb-editor .wb-card-menu-panel :is(button,summary),.wb-editor .wb-asset-folder>summary,.wb-editor .wb-insert-actions button{box-sizing:border-box;min-height:var(--wb-control-height);padding-block:3px}
.wb-editor .wb-edge-label-row{min-height:var(--wb-control-height)}
.wb-editor .wb-edge-label-row .wb-edge-label-menu{flex-basis:var(--wb-control-height);width:var(--wb-control-height)!important}
.wb-editor .wb-edge-label-row .wb-edge-label-text{padding-block:2px!important}
body[data-visual=editor] .research-ui :is(.research-ui-preset,.research-ui-send){box-sizing:border-box;min-height:24px;padding-block:3px}
/* Keep moving layers cheap, restoring the paper treatment after the gesture. */
.wb-editor[data-zooming=true] .wb-card,.wb-editor .flow-editor-viewport[data-panning=true] .wb-card{box-shadow:none!important;transition:none!important}
.wb-editor .flow-editor-viewport[data-panning=true] .wb-edges,.wb-editor[data-zooming=true] .wb-edges,.wb-editor[data-zooming=true] .wb-edge-labels{pointer-events:none}
</style>
