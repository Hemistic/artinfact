<style>
body[data-visual=editor]{overflow:hidden}

.wb-editor .flow-editor-body,.wb-editor .flow-work-area,.wb-editor .flow-editor-viewport{position:absolute!important;inset:0!important;width:100%;height:100%;margin:0;padding:0;min-width:0;min-height:0;border-radius:0;background-color:var(--bg)}
